name: npm-audit

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24.22.1"
      audit-level:
        description: low | moderate | high | critical
        type: string
        default: high
      omit:
        description: dependency groups to skip (e.g. "dev")
        type: string
        default: ""

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: cicd-sensor/cicd-sensor-action@49560b716a9abba9190a48c0b6bca18ba98918e8 # v0.0.40
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
      - name: npm audit
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
          OMIT: ${{ inputs.omit }}
        run: |
          args=(--package-lock-only --ignore-scripts "--audit-level=$AUDIT_LEVEL")
          if [ -n "$OMIT" ]; then args+=("--omit=$OMIT"); fi
          npm audit "${args[@]}"
