name: npm-audit

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      audit-level:
        description: low | moderate | high | critical
        type: string
        default: high
      omit:
        description: dependency groups to skip (e.g. "dev")
        type: string
        default: dev

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: npm audit
        run: npm audit --audit-level=${{ inputs.audit-level }} --omit=${{ inputs.omit }}
