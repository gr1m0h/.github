name: codeql-go

on:
  workflow_call:
    inputs:
      go-version:
        description: >-
          Explicit Go toolchain version. Leave empty (the default) to read the
          version from the target repo's go.mod, which keeps the CodeQL build
          toolchain in lock-step with the module's `go` directive.
        type: string
        default: ""

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: cicd-sensor/cicd-sensor-action@2b76335ff1c2dd298e983961f7a200d3fe9076c2 # v0.0.36
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # When go-version is empty, setup-go falls back to go-version-file so
          # the CodeQL autobuild toolchain always matches the target repo's go.mod.
          go-version: ${{ inputs.go-version }}
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:${{ matrix.language }}"
