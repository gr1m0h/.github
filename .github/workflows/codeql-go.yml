name: codeql-go

on:
  workflow_call:
    inputs:
      go-version:
        description: >-
          Explicit Go toolchain version. Leave empty (the default) to read the
          version from the target repo's go.mod, which keeps the CodeQL build
          toolchain in lock-step with the module's `go` directive.
        type: string
        default: ""

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: cicd-sensor/cicd-sensor-action@49560b716a9abba9190a48c0b6bca18ba98918e8 # v0.0.40
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # When go-version is empty, setup-go falls back to go-version-file so
          # the CodeQL autobuild toolchain always matches the target repo's go.mod.
          go-version: ${{ inputs.go-version }}
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
