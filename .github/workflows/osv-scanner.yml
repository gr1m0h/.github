name: osv-scanner

on:
  workflow_call:
    inputs:
      scan-args:
        description: Extra arguments forwarded to osv-scanner
        type: string
        default: "--recursive ./"

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: cicd-sensor/cicd-sensor-action@cb0546d5707fcb68bf755006cb97817b3750996b # v0.0.39
      # Without an explicit checkout the scanner runs against an empty
      # workspace and reports zero findings (a silent false negative).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: ${{ inputs.scan-args }}
