name: osv-scanner

on:
  workflow_call:
    inputs:
      scan-args:
        description: Extra arguments forwarded to osv-scanner
        type: string
        default: "--recursive ./"

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38
      # Without an explicit checkout the scanner runs against an empty
      # workspace and reports zero findings (a silent false negative).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: ${{ inputs.scan-args }}
