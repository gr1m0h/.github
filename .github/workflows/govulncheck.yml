name: govulncheck

on:
  workflow_call:
    inputs:
      go-version:
        description: >-
          Explicit Go toolchain version. Leave empty (the default) to read the
          version from the target repo's go.mod, which keeps the CI toolchain
          in lock-step with the module's `go` directive.
        type: string
        default: ""
      working-directory:
        description: Directory to run govulncheck in (use "." for repo root)
        type: string
        default: "."
      patterns:
        description: Package patterns passed to govulncheck (e.g. "./...")
        type: string
        default: "./..."

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: cicd-sensor/cicd-sensor-action@49560b716a9abba9190a48c0b6bca18ba98918e8 # v0.0.40
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # When go-version is empty, setup-go falls back to go-version-file so
          # the toolchain always matches the target repo's go.mod.
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@e672cbe8fbc8c76e28fcb6db0efd9ce354e0dac5 # v1.9.0
      - name: govulncheck
        working-directory: ${{ inputs.working-directory }}
        env:
          PATTERNS: ${{ inputs.patterns }}
        run: |
          read -r -a patterns <<< "$PATTERNS"
          govulncheck "${patterns[@]}"
